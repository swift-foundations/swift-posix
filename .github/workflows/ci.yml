name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + test matrix — see swift-foundations/.github/.github/workflows/swift-ci.yml (layer wrapper)
  ci:
    uses: swift-foundations/.github/.github/workflows/swift-ci.yml@main
    with:
      # POSIX platform package: composes the ISO/IEC 9945 (POSIX) surface.
      # Windows is not a POSIX system, so a Windows CI leg is illegitimate
      # here ([PLAT-ARCH-001]: the Windows counterpart is swift-windows /
      # swift-windows-standard, selected at the L3 seam).
      platform-support: apple,linux
    secrets: inherit

  # DocC umbrella-catalog pipeline per [DOC-019a] — see
  # swift-foundations/.github/.github/workflows/swift-docs.yml
  docs:
    uses: swift-foundations/.github/.github/workflows/swift-docs.yml@main
    secrets: inherit
